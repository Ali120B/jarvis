name: build-windows-installer

# Triggered by `npm run publish` (which pushes a v* tag).
# A real Windows runner builds the backend .exe (PyInstaller) and the NSIS
# installer (electron-builder), then attaches both to the draft release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend build deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile backend to exe
        run: python scripts/build_backend.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install electron deps
        working-directory: electron
        run: npm ci

      - name: Build NSIS installer
        working-directory: electron
        run: npx electron-builder --win nsis

      - name: Attach installer to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            electron/dist/*.exe
            electron/dist/*.blockmap
            electron/dist/latest.yml
